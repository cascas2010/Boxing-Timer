plugins { id 'com.android.application' }

android {
    namespace 'com.walterchan.boxingtimer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.walterchan.boxingtimer'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '1.3.10'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets.main.res.srcDir "$buildDir/generated/bellRes"
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.register('generateBellSound') {
    def outputFile = file("$buildDir/generated/bellRes/raw/boxing_bell_v2.wav")
    outputs.file(outputFile)
    doLast {
        outputFile.parentFile.mkdirs()
        int sampleRate = 44100
        int samples = (int) (sampleRate * 0.46)
        int dataSize = samples * 2
        def out = new ByteArrayOutputStream()
        def ascii = { String value -> out.write(value.getBytes('US-ASCII')) }
        def le16 = { int value -> out.write(value & 255); out.write((value >> 8) & 255) }
        def le32 = { int value -> out.write(value & 255); out.write((value >> 8) & 255); out.write((value >> 16) & 255); out.write((value >> 24) & 255) }
        ascii('RIFF'); le32(36 + dataSize); ascii('WAVEfmt '); le32(16); le16(1); le16(1)
        le32(sampleRate); le32(sampleRate * 2); le16(2); le16(16); ascii('data'); le32(dataSize)
        for (int i = 0; i < samples; i++) {
            double t = i / (double) sampleRate
            double attack = Math.min(1.0, t / 0.003)
            double envelope = attack * Math.exp(-7.2 * t)
            double shimmer = 0.88 + 0.12 * Math.sin(2.0 * Math.PI * 6.5 * t)
            double wave = 0.52 * Math.sin(2.0 * Math.PI * 760.0 * t)
                    + 0.34 * Math.sin(2.0 * Math.PI * 1187.0 * t)
                    + 0.24 * Math.sin(2.0 * Math.PI * 1763.0 * t)
                    + 0.15 * Math.sin(2.0 * Math.PI * 2491.0 * t)
                    + 0.09 * Math.sin(2.0 * Math.PI * 3233.0 * t)
            short value = (short) (wave * envelope * shimmer * 12500)
            le16(value)
        }
        outputFile.bytes = out.toByteArray()
    }
}

tasks.named('preBuild').configure { dependsOn 'generateBellSound' }

